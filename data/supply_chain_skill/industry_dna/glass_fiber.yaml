# 玻璃纤维行业 DNA（v3 静态兜底数据）
# 覆盖子赛道：风电/汽车/电子级/建材
# 数据来源：中国玻璃纤维工业协会、卓创资讯、上市公司年报
# last_updated: 2026-01-15

industry_name: 玻璃纤维
slug: glass_fiber
keywords:
  - 玻璃纤维
  - 玻纤
  - 玻纤纱
  - 玻纤制品
  - glass fiber
  - fiberglass
  - E-glass
  - 无碱直纱
  - 高模量纱
  - 电子布
  - 短切纤维
  - 风电叶片
products:
  - 无碱直纱（E-glass Direct Roving）
  - 玻纤织物/毡制品
  - 短切玻纤/热塑用纱
  - 电子级玻纤布（PCB 基布）
  - 高模量玻纤纱（S-glass/T-glass）
  - 耐碱玻纤（AR-glass）
key_players:
  - 中国巨石（600176）
  - 泰山玻纤
  - 重庆国际（CPIC）
  - Owens Corning（OC）
  - Jushi Egypt（海外基地）
  - Johns Manville
  - 台湾玻璃（南亚/台塑玻纤）
  - AGY（高模量特种）
  - Nippon Electric Glass（NEG）
concentration: "全球 CR3: 约 50%（巨石/OC/CPIC/泰山合计）；中国 CR3: 约 65%（巨石/泰山/重庆国际）"
customer_types:
  - 风电叶片厂商（金风/远景/明阳/Vestas/Siemens Gamesa）
  - 汽车零部件（玻璃钢车身/电池盖板）
  - PCB 覆铜板厂（生益科技/南亚/联茂/松下）
  - FRP 管道储罐/船艇/化工设备
  - 电子电气（5G 基站/AI 服务器高频高速板）
  - 建筑/卫浴/门窗型材
  - 航空航天（高模量特种）
supplier_types:
  - 矿料供应商（叶蜡石/硼钙石/石灰石/高岭土）
  - 天然气/电力/重油（能源）
  - 设备厂家（拉丝/捻线/织造）
  - 浸润剂/偶联剂化工料
  - 贵金属坩埚/漏板
  - 包装运输
demand_drivers:
  - 陆上风电/海上风电装机（叶片大型化带动高模量纱需求）
  - 新能源车轻量化（玻纤热塑复材替代金属）
  - AI/5G 服务器高频高速覆铜板（电子级细纱）
  - 出口替代（北美/欧洲建筑市场）
  - 光伏边框/支架新型应用
  - 大型储氢罐/海上风电浮体
  - 国产替代高端玻纤（S-glass/T-glass）
policy_catalysts:
  - 双碳目标（风电/新能源车）
  - 新材料专项（高模量纱）
  - 一带一路出口支持
  - 国产替代清单
  - 国家集成电路战略（PCB 配套）
substitution_threats:
  - 碳纤维（航空/高端，受成本限制）
  - 玄武岩纤维（少量替代）
  - 高性能塑料/金属（部分应用）
  - 玻纤回收技术（下游降本）
  - 玻纤-碳纤维混合材料
time_window: mid_term_6_12m
source: 中国玻璃纤维工业协会 2025 年报、卓创资讯 2025 行业报告、巨石/泰山玻纤上市公司 2025 年报
