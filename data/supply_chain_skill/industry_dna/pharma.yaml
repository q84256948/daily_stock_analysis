# 医药行业 DNA（v3 静态兜底数据）
# 覆盖子赛道：创新药/仿制药/医疗器械/CXO
# 数据来源：国家药监局、米内网、上市医药企业年报
# last_updated: 2026-01-15

industry_name: 医药
slug: pharma
keywords:
  - 医药
  - 制药
  - 创新药
  - 仿制药
  - 医疗器械
  - CXO
  - CDMO
  - 生物制药
  - 疫苗
  - 体外诊断
  - IVD
  - 中药
products:
  - 创新药（肿瘤/自免/代谢/神经）
  - 仿制药（含首仿/难仿）
  - 生物制药（单抗/双抗/ADC/GLP-1）
  - 原料药与中间体
  - 医疗器械（高值耗材/IVD/影像设备）
  - CXO/CDMO（CRO/CMO/CDMO）
  - 疫苗与血液制品
  - 中药与OTC
key_players:
  - 恒瑞医药（创新药龙头）
  - 药明康德（CXO 龙头）
  - 药明生物（生物药 CDMO）
  - 迈瑞医疗（医疗器械）
  - 联影医疗（医学影像）
  - 百济神州（创新药出海）
  - 信达生物（创新药）
  - 君实生物（创新药）
  - 复星医药（综合）
  - 上海医药/华润医药（流通+品牌）
  - 智飞生物/万泰生物（疫苗）
  - 同仁堂/云南白药（中药）
concentration: "CXO 全球 CR3: 30%+（药明康德/LabCorp/查尔斯河）；创新药 CR10 集中度高但分散；医疗器械 CR5: 50%+"
customer_types:
  - 三级医院
  - 基层医疗机构
  - 药店连锁
  - 海外药企（CXO 客户）
  - 政府医保/集采
  - 体检机构
  - 患者终端
supplier_types:
  - 原料药供应商
  - 药用辅料与包材
  - 医疗器械零部件
  - 实验耗材与试剂
  - 上游设备（反应器/灌装线）
  - 物流冷链
demand_drivers:
  - 老龄化加速
  - 创新药出海
  - 集采常态化（量价博弈）
  - 国产替代（医疗器械）
  - GLP-1 类减重药爆发
  - ADC/双抗技术迭代
policy_catalysts:
  - 国家医保谈判
  - 集采政策
  - 创新药鼓励政策（医保谈判/优先审评）
  - DRG/DIP 支付改革
  - FDA 审评政策（出海）
  - 中医药传承发展
substitution_threats:
  - 仿制药替代原研（专利到期）
  - 生物类似药
  - 新型疗法（CGT/基因治疗）
  - 中成药替代（部分领域）
  - AI 辅助药物研发（降本增效）
time_window: long_term_12_36m
source: 国家药监局 2025 年报数据、米内网、上市医药企业 2025 年报
