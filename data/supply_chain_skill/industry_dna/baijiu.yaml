# 白酒行业 DNA（v3 静态兜底数据）
# 覆盖子赛道：高端/次高端/酱香/浓香/清香
# 数据来源：中国酒业协会、国家统计局、上市酒企年报
# last_updated: 2026-01-15

industry_name: 白酒
slug: baijiu
keywords:
  - 白酒
  - 茅台
  - 五粮液
  - 泸州老窖
  - 汾酒
  - 洋河
  - 酱香
  - 浓香
  - 高端白酒
  - 次高端
products:
  - 高端白酒（800元以上，茅台/五粮液/老窖）
  - 次高端（300-800元）
  - 中端（100-300元）
  - 低端（100元以下）
  - 生肖酒/纪念酒（收藏属性）
  - 出口白酒（海外华人/免税）
key_players:
  - 贵州茅台（高端绝对龙头）
  - 五粮液（浓香高端）
  - 泸州老窖（浓香次高端）
  - 山西汾酒（清香龙头）
  - 洋河股份（绵柔浓香）
  - 古井贡酒（徽酒龙头）
  - 舍得酒业/水井坊（次高端）
  - 习酒/郎酒（酱香次高端）
concentration: "高端 CR3: 90%+（茅台/五粮液/老窖）；酱香 CR3: 95%+（茅台/习酒/郎酒）；全行业 CR10: 50%+"
customer_types:
  - 高端商务宴请
  - 礼品市场
  - 收藏/投资
  - 高净值个人
  - 经销商体系
  - 团购/国企客户
  - 海外华人/免税渠道
supplier_types:
  - 有机高粱/小麦基地
  - 包装材料（玻瓶/礼盒）
  - 物流与仓储
  - 经销商体系
  - 酒厂自建产能（基酒陈酿）
demand_drivers:
  - 商务活动复苏
  - 高净值人群扩增
  - 品牌集中度提升
  - 收藏/投资属性
  - 海外华人市场
  - 反腐边际企稳
policy_catalysts:
  - 消费税改革预期
  - 反腐政策（边际企稳）
  - 行业准入与产能审批
  - 食品安全监管
  - 出口退税政策
substitution_threats:
  - 进口烈酒（干邑/威士忌）
  - 其他高端消费品（奢侈品/艺术品）
  - 红酒/黄酒（消费习惯变化）
  - 新式低度酒（年轻群体）
time_window: mid_term_6_12m
source: 中国酒业协会 2025 年报数据、国家统计局酒类消费数据、上市酒企年报
